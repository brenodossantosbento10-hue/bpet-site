
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPet</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1518717758536-85ae29035b6d');
      background-size: cover;
      background-position: center;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 600;
    }

    header p {
      margin-top: 15px;
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 30px;
      background: #22c55e;
      border-radius: 50px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    section {
      padding: 80px 20px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 50px;
      font-size: 2.2rem;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 4px;
      background: #22c55e;
      top: 0;
      left: 0;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .about img {
      width: 100%;
      border-radius: 20px;
    }

    .testimonials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .testimonial {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .contact {
      text-align: center;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 35px;
      background: #25D366;
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .whatsapp:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #020617;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @media(max-width: 768px) {
      header h1 { font-size: 2.5rem; }
      .about { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>BPet</h1>
  <p>Cuidado de alto padrão para o seu melhor amigo 🐾</p>
  <a href="#contato" class="btn">Agendar Atendimento</a>
</header>

<section>
  <h2>Serviços</h2>
  <div class="services">
    <div class="card">
      <h3>Passeios Premium</h3>
      <p>Rotina saudável com atenção exclusiva e segurança total.</p>
    </div>
    <div class="card">
      <h3>Pet Sitter</h3>
      <p>Cuidado personalizado na sua casa, sem estresse para o pet.</p>
    </div>
    <div class="card">
      <h3>Hospedagem</h3>
      <p>Ambiente confortável e seguro, como um verdadeiro lar.</p>
    </div>
  </div>
</section>

<section class="about">
  <div>
    <h2>Sobre</h2>
    <p>Atendimento exclusivo com foco em bem-estar, segurança e carinho. Aqui, cada pet recebe atenção individual e tratamento de alto padrão.</p>
  </div>
  <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1" alt="Pet">
</section>

<section>
  <h2>Depoimentos</h2>
  <div class="testimonials">
    <div class="testimonial">"Meu cachorro ama! Atendimento impecável."</div>
    <div class="testimonial">"Profissional extremamente cuidadoso e confiável."</div>
    <div class="testimonial">"Viajo tranquila sabendo que meu pet está em boas mãos."</div>
  </div>
</section>

<section id="contato" class="contact">
  <h2>Agende Agora</h2>
  <p>Fale comigo diretamente pelo WhatsApp</p>
  <a class="whatsapp" href="https://wa.me/5519984424611">Chamar no WhatsApp</a>
</section>

<footer>
  <p>© 2026 BPet — Atendimento Premium</p>
</footer>

</body>
</html>
